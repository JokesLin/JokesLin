<svg width="1600" height="760" viewBox="0 0 1600 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Joke Lin — Liquid Glass profile</title>
  <desc id="desc">A cinematic dark desktop window introducing Joke Lin as a rural development researcher and builder.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="24" x2="1510" y2="736" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090A10"/>
      <stop offset="0.48" stop-color="#11101D"/>
      <stop offset="1" stop-color="#07131D"/>
    </linearGradient>
    <linearGradient id="chrome" x1="88" y1="72" x2="1512" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#A8B4FF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#76D7FF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="aurora" x1="488" y1="170" x2="1190" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6BCD"/>
      <stop offset="0.3" stop-color="#9C7BFF"/>
      <stop offset="0.64" stop-color="#4DC9FF"/>
      <stop offset="1" stop-color="#5CFFE0"/>
    </linearGradient>
    <linearGradient id="glass" x1="1048" y1="194" x2="1434" y2="526" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.035"/>
    </linearGradient>
    <linearGradient id="line" x1="1046" y1="560" x2="1434" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF70C7"/>
      <stop offset="0.48" stop-color="#9C7BFF"/>
      <stop offset="1" stop-color="#59D9FF"/>
    </linearGradient>
    <radialGradient id="pinkGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(710 318) rotate(35) scale(420 260)">
      <stop stop-color="#F66BCB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F66BCB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1230 380) rotate(125) scale(390 290)">
      <stop stop-color="#51D9FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#51D9FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" stroke="#B6C6FF" stroke-opacity="0.085"/>
    </pattern>
    <filter id="blur" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="deepShadow" x="-35%" y="-35%" width="170%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="32" stdDeviation="30" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="softShadow" x="-35%" y="-35%" width="170%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect width="1600" height="760" rx="42" fill="#05060A"/>
  <rect x="18" y="18" width="1564" height="724" rx="34" fill="url(#bg)" stroke="#41465C" stroke-opacity="0.72"/>
  <rect x="34" y="34" width="1532" height="692" rx="26" fill="url(#grid)" opacity="0.4"/>
  <ellipse cx="720" cy="310" rx="500" ry="320" fill="url(#pinkGlow)" filter="url(#blur)"/>
  <ellipse cx="1240" cy="380" rx="440" ry="310" fill="url(#blueGlow)" filter="url(#blur)"/>

  <g filter="url(#deepShadow)">
    <rect x="72" y="70" width="1456" height="620" rx="30" fill="#090B12" fill-opacity="0.58" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <rect x="72" y="70" width="1456" height="76" rx="30" fill="url(#chrome)" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <path d="M72 116C72 90.595 92.595 70 118 70H1482C1507.4 70 1528 90.595 1528 116V146H72V116Z" fill="#FFFFFF" fill-opacity="0.018"/>
    <circle cx="112" cy="108" r="8" fill="#FF5F57"/>
    <circle cx="140" cy="108" r="8" fill="#FEBC2E"/>
    <circle cx="168" cy="108" r="8" fill="#28C840"/>
    <text x="214" y="114" fill="#F1F3FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="650" letter-spacing="3">JOKE LIN / PERSONAL WORKSPACE</text>
    <text x="1480" y="114" text-anchor="end" fill="#9AA3C6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="2.2">FUZHOU · 01:01 · ONLINE</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="116" y="194" width="846" height="410" rx="28" fill="#0D0E16" fill-opacity="0.42" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="160" y="250" fill="#AAB4D3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="4">RURAL × DATA × AI</text>
    <text x="156" y="348" fill="#FBFBFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="88" font-weight="760" letter-spacing="-5">JOKE</text>
    <text x="156" y="438" fill="#FBFBFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="88" font-weight="760" letter-spacing="-5">LIN<tspan fill="#A78BFA">.</tspan></text>
    <path d="M160 492H414" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
    <text x="160" y="540" fill="#C6C9DE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="450">Researcher · Builder · Guitarist</text>
    <text x="160" y="574" fill="#7F86A8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" letter-spacing="0.3">Turning messy questions into useful interfaces.</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1040" y="194" width="400" height="410" rx="28" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <circle cx="1082" cy="238" r="6" fill="#59D9FF"/>
    <text x="1102" y="243" fill="#E9F2FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="3">NOW / ACTIVE</text>
    <text x="1080" y="318" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700">RESEARCH</text>
    <text x="1080" y="366" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700">BUILD</text>
    <text x="1080" y="414" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700">PLAY</text>
    <path d="M1080 458H1400" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="1080" y="504" fill="#B9C7E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="520">Python · AI · Frontend</text>
    <text x="1080" y="532" fill="#B9C7E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="520">Rural development · Guitar</text>
    <rect x="1080" y="562" width="320" height="4" rx="2" fill="url(#line)"/>
  </g>

  <text x="116" y="662" fill="#747C9B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="650" letter-spacing="2.8">A SMALL WINDOW INTO THE WORK</text>
  <text x="1484" y="662" text-anchor="end" fill="#747C9B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="650" letter-spacing="2.8">01 / 03</text>
</svg>
