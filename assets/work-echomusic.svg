    <text x="1084" y="112" text-anchor="end" fill="#858DAA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="1.8">NOW PLAYING</text>

    <rect x="124" y="188" width="364" height="364" rx="28" fill="url(#album)"/>
    <circle cx="308" cy="370" r="111" fill="#0A0B12" fill-opacity="0.38" stroke="#FFFFFF" stroke-opacity="0.22"/>
    <circle cx="308" cy="370" r="72" fill="#0A0B12" fill-opacity="0.52" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <circle cx="308" cy="370" r="12" fill="#FFFFFF" fill-opacity="0.88"/>
    <path d="M158 494C214 418 295 482 348 420C388 374 427 398 466 348" stroke="#FFFFFF" stroke-opacity="0.44" stroke-width="2"/>
    <text x="156" y="230" fill="#FFFFFF" fill-opacity="0.84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="2.8">CONCEPT PLAYER</text>
    <text x="156" y="582" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="650">EchoMusic</text>

    <text x="580" y="220" fill="#A6B2D6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="2.8">A SMALL STUDY IN SOUND</text>
    <text x="580" y="286" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="700" letter-spacing="-1.6">Echoes in</text>
    <text x="580" y="334" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="700" letter-spacing="-1.6">motion.</text>
    <text x="580" y="382" fill="#A3AAC3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">A third-party Kugou concept player.</text>
    <text x="580" y="410" fill="#A3AAC3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">Music product, interface, and interaction.</text>

    <path d="M580 468H1050" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <path d="M580 468C602 434 614 512 630 472C648 426 660 508 680 459C696 420 710 514 728 466C744 424 760 504 776 460C794 414 808 514 828 468C846 422 860 504 880 460C898 420 914 508 932 466C950 430 968 492 982 458C1000 420 1022 488 1050 450" stroke="url(#wave)" stroke-width="3" stroke-linecap="round"/>
    <text x="580" y="522" fill="#7F86A8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">00:42</text>
    <text x="1050" y="522" text-anchor="end" fill="#7F86A8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">03:18</text>
    <circle cx="812" cy="570" r="24" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <path d="M806 558L824 570L806 582V558Z" fill="#FFFFFF"/>
