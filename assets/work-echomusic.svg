<svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">EchoMusic preview</title>
  <desc id="desc">A dark music player interface with an iridescent album card and waveform.</desc>
  <defs>
    <linearGradient id="bg" x1="106" y1="42" x2="1116" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15131F"/>
      <stop offset="0.52" stop-color="#0E1522"/>
      <stop offset="1" stop-color="#071B24"/>
    </linearGradient>
    <linearGradient id="album" x1="190" y1="202" x2="514" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5EAE"/>
      <stop offset="0.4" stop-color="#7C6FFF"/>
      <stop offset="0.74" stop-color="#49D6F9"/>
      <stop offset="1" stop-color="#D4FF86"/>
    </linearGradient>
    <linearGradient id="wave" x1="636" y1="444" x2="1046" y2="444" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF70C7"/>
      <stop offset="0.5" stop-color="#9A83FF"/>
      <stop offset="1" stop-color="#55E0FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(330 305) rotate(90) scale(270)">
      <stop stop-color="#B66BFF" stop-opacity="0.37"/>
      <stop offset="1" stop-color="#B66BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#A7CFFF" stroke-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="34" fill="#07080D"/>
  <rect x="18" y="18" width="1164" height="644" rx="26" fill="url(#bg)" stroke="#58617C" stroke-opacity="0.55"/>
  <rect x="32" y="32" width="1136" height="616" rx="20" fill="url(#grid)" opacity="0.42"/>
  <circle cx="330" cy="305" r="280" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <rect x="72" y="72" width="1056" height="536" rx="28" fill="#0B0D15" fill-opacity="0.74" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <rect x="72" y="72" width="1056" height="68" rx="28" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="110" cy="106" r="7" fill="#FF5F57"/>
    <circle cx="136" cy="106" r="7" fill="#FEBC2E"/>
    <circle cx="162" cy="106" r="7" fill="#28C840"/>
