<svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Personal Portal preview</title>
  <desc id="desc">A dark glass personal portal interface with bookmarks, notes, and creative work.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="52" x2="1128" y2="648" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151424"/>
      <stop offset="0.54" stop-color="#10121E"/>
      <stop offset="1" stop-color="#0B1D25"/>
    </linearGradient>
    <linearGradient id="accent" x1="288" y1="180" x2="1002" y2="558" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF70C7"/>
      <stop offset="0.5" stop-color="#8C7BFF"/>
      <stop offset="1" stop-color="#55DFFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(835 230) rotate(120) scale(380 320)">
      <stop stop-color="#6D70FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6D70FF" stop-opacity="0"/>
