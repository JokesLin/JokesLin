<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Joke Lin profile window</title>
  <desc id="desc">A dark macOS-inspired window introducing Joke Lin as a rural development researcher building with data and AI.</desc>
  <defs>
    <linearGradient id="bg" x1="92" y1="44" x2="1112" y2="532" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101722"/>
      <stop offset="0.52" stop-color="#0D121A"/>
      <stop offset="1" stop-color="#111B2A"/>
    </linearGradient>
    <linearGradient id="header" x1="52" y1="38" x2="1127" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A2431" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#131A25" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="blue" x1="818" y1="180" x2="1082" y2="396" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4AA8FF"/>
      <stop offset="0.52" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#335CFF"/>
    </linearGradient>
    <linearGradient id="glass" x1="804" y1="150" x2="1083" y2="412" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F8FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7DBBFF" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(948 260) rotate(90) scale(260)">
      <stop stop-color="#0A84FF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#90A9C4" stroke-opacity="0.11"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#02050A" flood-opacity="0.56"/>
    </filter>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="34" fill="#090C11"/>
  <rect x="12" y="12" width="1176" height="536" rx="28" fill="url(#bg)" stroke="#314052" stroke-opacity="0.72"/>
  <rect x="25" y="25" width="1150" height="510" rx="22" fill="url(#grid)" opacity="0.34"/>
  <circle cx="962" cy="266" r="238" fill="url(#glow)" filter="url(#blur)"/>

  <g filter="url(#shadow)">
    <rect x="42" y="42" width="1116" height="70" rx="19" fill="url(#header)" stroke="#65758B" stroke-opacity="0.22"/>
    <circle cx="74" cy="77" r="7" fill="#FF5F57"/>
    <circle cx="98" cy="77" r="7" fill="#FEBC2E"/>
    <circle cx="122" cy="77" r="7" fill="#28C840"/>
    <text x="154" y="82" fill="#DDE7F3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="2.2">JOKE LIN / PROFILE</text>
    <text x="1085" y="82" text-anchor="end" fill="#8292A7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="1.6">FUZHOU · CN</text>
  </g>

  <text x="78" y="190" fill="#93A4B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="3.2">RURAL DEVELOPMENT × DATA × AI</text>
  <text x="76" y="258" fill="#F4F7FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" letter-spacing="-2.4">研究问题，</text>
  <text x="76" y="320" fill="#F4F7FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" letter-spacing="-2.4">也做工具。</text>
  <rect x="78" y="363" width="104" height="4" rx="2" fill="#0A84FF"/>
  <text x="78" y="414" fill="#AEBBCD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="400">Researching real questions.</text>
  <text x="78" y="443" fill="#AEBBCD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="400">Building useful interfaces.</text>

  <g filter="url(#shadow)">
    <rect x="786" y="150" width="290" height="274" rx="25" fill="url(#glass)" stroke="#B6D5F8" stroke-opacity="0.28"/>
    <circle cx="818" cy="184" r="5" fill="#0A84FF"/>
    <text x="836" y="189" fill="#D8E8FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="2.4">CURRENT MODE</text>
    <text x="818" y="245" fill="#F4F7FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700">RESEARCH</text>
    <text x="818" y="280" fill="#F4F7FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700">BUILD</text>
    <text x="818" y="315" fill="#F4F7FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700">PLAY</text>
    <path d="M818 349H1044" stroke="#B6D5F8" stroke-opacity="0.2"/>
    <text x="818" y="379" fill="#91A8C2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500">Python · AI · Frontend · Guitar</text>
  </g>

  <text x="78" y="505" fill="#617187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="1.8">A SMALL WINDOW INTO THE WORK</text>
  <text x="1122" y="505" text-anchor="end" fill="#617187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="1.8">01 / 01</text>
</svg>
